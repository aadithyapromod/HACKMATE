services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackmate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RUNNER_WORKSPACE_ROOT=/app/generated
    volumes:
      - ./backend/app:/app/app:ro
      - ./generated:/app/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackmate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: hackmate-runner
    # Non-privileged, isolated container for sandboxed builds
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 1g
    cpus: 1.5
    volumes:
      - ./generated:/workspace
    environment:
      - NODE_ENV=development
    # By default, runner acts as an on-demand worker / task executor
    command: ["python", "-m", "runner.runner"]
